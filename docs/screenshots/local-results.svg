<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">AWESEARCH local results preview</title><desc id="desc">Illustrative results screen showing a local search for privacy with file snippets and source labels.</desc><defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#c2d0ff"/><stop offset="1" stop-color="#708eff"/></linearGradient></defs><rect width="1440" height="900" rx="22" fill="#080d17"/><rect width="258" height="900" rx="22" fill="#0b1220"/><path d="M258 0V900" stroke="#263148"/><rect x="27" y="28" width="40" height="40" rx="12" fill="url(#a)"/><circle cx="46" cy="46" r="9" fill="none" stroke="#10192b" stroke-width="3"/><path d="m53 53 7 7" stroke="#10192b" stroke-width="3"/><text x="79" y="44" fill="#f0f4ff" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">AWESEARCH</text><text x="79" y="60" fill="#7f8eaa" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.7">SEARCH WORKSPACE</text><rect x="16" y="106" width="226" height="46" rx="10" fill="#1d2b48" stroke="#344a73"/><text x="61" y="134" fill="#e0e8ff" font-family="Arial,sans-serif" font-size="13">All results</text><text x="61" y="184" fill="#a6b3ca" font-family="Arial,sans-serif" font-size="13">Local files</text><text x="61" y="229" fill="#a6b3ca" font-family="Arial,sans-serif" font-size="13">Web search</text><text x="30" y="288" fill="#657590" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">YOUR WORKSPACE</text><text x="61" y="328" fill="#a6b3ca" font-family="Arial,sans-serif" font-size="13">Add files</text><text x="61" y="372" fill="#a6b3ca" font-family="Arial,sans-serif" font-size="13">Index a folder</text><text x="61" y="416" fill="#a6b3ca" font-family="Arial,sans-serif" font-size="13">Search settings</text><rect x="16" y="695" width="226" height="125" rx="12" fill="#101f2d" stroke="#294456"/><text x="30" y="721" fill="#d9ebe7" font-family="Arial,sans-serif" font-size="12" font-weight="700">LOCAL-FIRST PRIVACY</text><text x="30" y="751" fill="#8fa9b1" font-family="Arial,sans-serif" font-size="11">Files stay on your device.</text><text x="30" y="768" fill="#8fa9b1" font-family="Arial,sans-serif" font-size="11">Search runs locally.</text><rect x="258" width="1182" height="70" fill="#0b1220"/><path d="M258 70H1440" stroke="#222e43"/><text x="302" y="41" fill="#7e8ca7" font-family="Arial,sans-serif" font-size="12">Workspace</text><text x="366" y="41" fill="#4b5a73" font-family="Arial,sans-serif" font-size="12">/</text><text x="382" y="41" fill="#c8d2e7" font-family="Arial,sans-serif" font-size="12">Local files</text><text x="302" y="121" fill="#9eb3ff" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">LOCAL INDEX SEARCH</text><text x="302" y="161" fill="#edf2ff" font-family="Arial,sans-serif" font-size="30" font-weight="700">Results for “privacy”</text><text x="302" y="187" fill="#8998b5" font-family="Arial,sans-serif" font-size="12">Example layout preview • results depend on the files you index</text><rect x="302" y="213" width="1080" height="57" rx="11" fill="#121d2f" stroke="#455779"/><circle cx="329" cy="241" r="7" fill="none" stroke="#9db1ff" stroke-width="2"/><path d="m334 246 5 5" stroke="#9db1ff" stroke-width="2"/><text x="354" y="246" fill="#dce5f9" font-family="Arial,sans-serif" font-size="14">privacy</text><rect x="1247" y="228" width="113" height="27" rx="7" fill="#233354"/><text x="1303" y="246" fill="#c8d6ff" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">LOCAL FILES</text>
<g><rect x="302" y="294" width="1080" height="143" rx="12" fill="#101a2a" stroke="#29374e"/><rect x="325" y="316" width="43" height="43" rx="10" fill="#263657"/><path d="M337 327h19v20h-19zM341 332h11M341 337h11" stroke="#a9bcff" stroke-width="1.7" fill="none"/><text x="388" y="326" fill="#77cbb1" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">LOCAL INDEX</text><text x="388" y="352" fill="#e6edf9" font-family="Arial,sans-serif" font-size="16" font-weight="700">privacy-policy.md</text><text x="388" y="373" fill="#91aaff" font-family="Arial,sans-serif" font-size="11">Documents / Product / privacy-policy.md</text><text x="388" y="400" fill="#9ba9c0" font-family="Arial,sans-serif" font-size="12">Privacy is built into the design. Local search keeps the contents of your selected files</text><text x="388" y="418" fill="#9ba9c0" font-family="Arial,sans-serif" font-size="12">on this device and indexes only content you explicitly choose.</text><rect x="1279" y="312" width="78" height="27" rx="7" fill="#18263d" stroke="#33445f"/><text x="1318" y="330" fill="#b9c9ed" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">OPEN ↗</text></g>
<g><rect x="302" y="455" width="1080" height="143" rx="12" fill="#101a2a" stroke="#29374e"/><rect x="325" y="477" width="43" height="43" rx="10" fill="#1c3340"/><path d="M337 488h19v20h-19zM341 493h11M341 498h11" stroke="#72d7b9" stroke-width="1.7" fill="none"/><text x="388" y="487" fill="#77cbb1" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">LOCAL INDEX</text><text x="388" y="513" fill="#e6edf9" font-family="Arial,sans-serif" font-size="16" font-weight="700">README.md</text><text x="388" y="534" fill="#91aaff" font-family="Arial,sans-serif" font-size="11">Projects / AWESearch / README.md</text><text x="388" y="561" fill="#9ba9c0" font-family="Arial,sans-serif" font-size="12">Never upload local file contents to web search by default. Show clear labels for local</text><text x="388" y="579" fill="#9ba9c0" font-family="Arial,sans-serif" font-size="12">and online sources, and let users clear the index whenever they want.</text><rect x="1279" y="473" width="78" height="27" rx="7" fill="#18263d" stroke="#33445f"/><text x="1318" y="491" fill="#b9c9ed" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">OPEN ↗</text></g>
<g><rect x="302" y="616" width="1080" height="143" rx="12" fill="#101a2a" stroke="#29374e"/><rect x="325" y="638" width="43" height="43" rx="10" fill="#2b2b47"/><path d="M337 649h19v20h-19zM341 654h11M341 659h11" stroke="#c0b6ff" stroke-width="1.7" fill="none"/><text x="388" y="648" fill="#77cbb1" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">LOCAL INDEX</text><text x="388" y="674" fill="#e6edf9" font-family="Arial,sans-serif" font-size="16" font-weight="700">search-settings.json</text><text x="388" y="695" fill="#91aaff" font-family="Arial,sans-serif" font-size="11">Config / search-settings.json</text><text x="388" y="722" fill="#9ba9c0" font-family="Arial,sans-serif" font-size="12">Choose which folders to index, select a language, and export the index metadata</text><text x="388" y="740" fill="#9ba9c0" font-family="Arial,sans-serif" font-size="12">for backup. The current web prototype supports text-like formats.</text><rect x="1279" y="634" width="78" height="27" rx="7" fill="#18263d" stroke="#33445f"/><text x="1318" y="652" fill="#b9c9ed" font-family="Arial,sans-serif" font-size="10" text-anchor="middle">OPEN ↗</text></g><text x="302" y="825" fill="#697994" font-family="Arial,sans-serif" font-size="11">Illustrative preview — file names and excerpts above are sample content, not real indexed files.</text><text x="302" y="850" fill="#52617a" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">AWESEARCH • LOCAL RESULTS SCREEN</text></svg>